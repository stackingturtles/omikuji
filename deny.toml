# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Target platforms to check
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ============================================================================
# Advisories - Check for known vulnerabilities
# ============================================================================
[advisories]
# The database of advisories to check against
db-path = "~/.cargo/advisory-db"
# URL to fetch advisories from
db-urls = ["https://github.com/rustsec/advisory-db"]
# How to handle advisories that have been withdrawn
yanked = "warn"
# Ignore specific advisories (use sparingly, document why)
ignore = [
    # paste proc-macro - transitive from alloy-primitives, cannot control without forking alloy
    # proc-macro only used at compile time, not in runtime binary
    # Low security risk - will be resolved when alloy upgrades to pastey or alternative
    "RUSTSEC-2024-0436",

    # rsa - transitive from sqlx-mysql, but we only use postgres (not mysql)
    # Not compiled into our binary since mysql feature is not enabled
    # No fixed version available - will monitor for sqlx updates
    "RUSTSEC-2023-0071",

    # derivative - transitive from ark-ff via ruint via alloy-primitives
    # Unmaintained crate, but no security vulnerability
    # Will be resolved when alloy/ruint dependencies update
    "RUSTSEC-2024-0388",

    # lru - transitive from alloy-provider, unsound IterMut issue
    # We don't use the problematic IterMut API in our code
    # Will be resolved when alloy updates lru dependency
    "RUSTSEC-2026-0002",
]

# ============================================================================
# Licenses - Ensure all dependencies have acceptable licenses
# ============================================================================
[licenses]
# Confidence threshold for license detection (0.0 to 1.0)
confidence-threshold = 0.8

# List of allowed licenses (SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Clarify licenses for crates that cargo-deny can't auto-detect
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ============================================================================
# Bans - Restrict certain crates or versions
# ============================================================================
[bans]
# How to handle multiple versions of the same crate
multiple-versions = "warn"
# How to handle crates that are allowed but not in the allow list
wildcards = "allow"
# Highlight the crate causing the duplicate
highlight = "all"

# Crates to deny completely
deny = [
    # Example: { name = "openssl", wrappers = ["openssl-sys"] }
]

# Crates to allow specific versions only
# allow = []

# Skip duplicate version checks for these crates
skip = [
    # Common crates with multiple versions in dependency tree
    # { name = "syn", version = "*" },
]

# Skip checking entire dependency trees rooted at these crates
skip-tree = [
    # { name = "windows-sys", version = "*" },
]

# ============================================================================
# Sources - Restrict where crates can be fetched from
# ============================================================================
[sources]
# What sources are allowed
unknown-registry = "deny"
unknown-git = "warn"
# Allow crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific git sources
allow-git = [
    "https://github.com/stackingturtles/omikuji.git",
]

[sources.allow-org]
# Allow all crates from specific GitHub organizations
github = []
