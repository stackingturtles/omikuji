[package]
name = "omikuji-core"
version = "0.7.1"
edition = "2021"
authors = ["Stacking Turtles Ltd"]
license = "MIT OR Apache-2.0"
description = "Core traits and interfaces for Omikuji plugin system"
repository = "https://github.com/ijonas/omikuji"

[features]
default = []
pro = []

[dependencies]
# Core async and error handling
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime (full features for runtime module)
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3.20"

# Time and scheduling
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
tokio-cron-scheduler = "0.9"

# Ethereum interaction
alloy = { version = "0.8", features = [
  "full",
  "node-bindings",
  "signer-local",
  "provider-http",
  "provider-ws",
  "contract",
  "rpc",
] }
hex = "0.4"

# HTTP client for external data
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"

# Metrics
prometheus = "0.14"
prometheus-hyper = "0.1"
hyper = { version = "1.0", features = ["server", "http1"] }

# Database (postgres only - no mysql to avoid rsa vulnerability)
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "migrate",
  "macros",
  "json",
] }

# Retry mechanisms
backoff = { version = "0.4", features = ["futures"] }
jsonpath-rust = "0.3"

# Utilities
lazy_static = "1.4"
once_cell = "1.19"
dirs = "5.0"

# Key storage (Community edition providers)
keyring = "3.0"
secrecy = "0.10"

# Vault support (Community edition)
vaultrs = "0.7"

# For the plugin registry
dashmap = "6.0"
arc-swap = "1.7"

# Configuration validation
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
mockall = "0.13"
mockito = "1.2"
tempfile = "3.8"