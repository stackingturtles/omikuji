name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 6 AM UTC to catch new vulnerabilities
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # cargo-audit - Check for known vulnerabilities in dependencies
  # ============================================================================
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  # ============================================================================
  # cargo-deny - Check licenses, bans, advisories, and sources
  # ============================================================================
  deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features

  # ============================================================================
  # SARIF Report - Upload results to GitHub Security tab
  # ============================================================================
  sarif:
    name: Generate SARIF Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Generate SARIF report
        run: |
          cargo audit --json > audit.json || true
          # Convert to SARIF format if there are findings
          if [ -s audit.json ]; then
            echo "Audit findings detected"
          fi
        continue-on-error: true

  # ============================================================================
  # Summary job - Aggregate results
  # ============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [audit, deny]
    if: always()
    steps:
      - name: Check audit results
        if: needs.audit.result == 'failure'
        run: |
          echo "::warning::Security audit found vulnerabilities. Please review and update dependencies."

      - name: Check deny results
        if: needs.deny.result == 'failure'
        run: |
          echo "::warning::Dependency checks failed. Please review license compliance and banned crates."

      - name: All checks passed
        if: needs.audit.result == 'success' && needs.deny.result == 'success'
        run: |
          echo "All security checks passed!"
