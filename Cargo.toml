[workspace]
members = [".", "omikuji-core"]

[package]
name = "omikuji"
version = "0.7.1"
edition = "2021"
authors = ["Ijonas Kisselbach <ijonas@ijonas.com>"]
description = "A lightweight EVM blockchain datafeed provider daemon"
repository = "https://github.com/ijonas/omikuji"
license = "MIT"

[dependencies]
# Core plugin traits and shared runtime
omikuji-core = { path = "omikuji-core" }
# Community plugins are embedded in src/plugins/ (no external dependency)
# Configuration and CLI
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
validator = { version = "0.16", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
dotenv = "0.15"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3.20"

# Ethereum interaction
alloy = { version = "0.8", features = [
  "full",
  "node-bindings",
  "signer-local",
  "provider-http",
  "provider-ws",
  "contract",
  "rpc",
] }
hex = "0.4"

# HTTP client for external data
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"

# Metrics
prometheus = "0.14"
prometheus-hyper = "0.1"
hyper = { version = "1.0", features = ["server", "http1"] }

# Retry mechanisms
backoff = { version = "0.4", features = ["futures"] }
jsonpath-rust = "0.3"

# Database (postgres only - no mysql to avoid rsa vulnerability)
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "migrate",
  "macros",
  "json",
] }
chrono = { version = "0.4", features = ["serde"] }

# Cron scheduling
cron = "0.12"
tokio-cron-scheduler = "0.9"

# Utilities
lazy_static = "1.4"
once_cell = "1.19"

# Community edition key storage plugins
keyring = "3.0"
secrecy = "0.10"
rpassword = "7.3"

[dev-dependencies]
tempfile = "3.9"
rand = "0.9"
mockito = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
